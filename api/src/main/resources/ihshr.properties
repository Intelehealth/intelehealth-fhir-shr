# IHSHR classpath fallbacks (primary config: OpenMRS global properties ihshr.* in Administration)

resource.location.import=LOCATION_IMPORT
resource.location.export=LOCATION_EXPORT
resource.patient.export=PATIENT
resource.practitioner.export=PRACTITIONER
resource.encounter.export=ENCOUNTER
resource.observation.export=OBSERVATION
resource.medication.export=MEDICATION
resource.medication.request.export=MEDICATION_REQUEST
resource.service.request.export=SERVICE_REQUEST
resource.diagnostic.report.export=DIAGNOSTIC_REPORT

# Keys below omit the "ihshr." prefix; runtime GP names are ihshr.<key> (see config.xml).
#local.openmrs.url=http://192.168.19.152:8080/openmrs
local.openmrs.url=http://192.168.19.152:8080/openmrs
local.openmrs.clientid.password.basic.auth=admin:apple@1Mango

gofr.openhim.url=http://192.168.19.152:6001/shr/DEFAULT
gofr.openhim.clientid.password.basic.auth=fhir_app:Admin123

opencr.shr.url=http://192.168.19.152:6001/shr/fhir/
opencr.shr.credential=fhir_app:Admin123

# SNOMED / topic lookup tables (doc §8): files under <dir>/lookups/*.json
shr.lookup.dir=/opt/intelehealth/shr-config

# Doc §5.3 no-echo: unique per deployment (override via GP intelehealth.shr.source.uri)
shr.source.uri=https://intelehealth.org/openmrs/installation-unknown

# Doc §12 Provenance agent references (must exist on SHR or be bootstrapped there)
shr.provenance.organization.reference=Organization/intelehealth
shr.provenance.device.reference=Device/shr-sync-omod
shr.provenance.practitioner.doctor.reference=Practitioner/unknown-doctor
shr.provenance.practitioner.hw.reference=Practitioner/unknown-hw

# Doc §4 pull API (defaults; override via GP ihshr.shr.pull.*)
shr.pull.source.filter.enabled=true
shr.pull.default.count=50
shr.pull.max.count=200
shr.pull.default.months=12

# Published config API: fhir_module.shr=true enables outbound SHR visit push (override via GP ihshr.config.published.url or intelehealth.config.published.url)
config.published.url=http://192.168.19.152:8080:4004/api/config/getPublishedConfig
fhir.sync.published.config.cache.seconds=60

intelehealth.fhir.resource.identifier.name=MPI

# OpenMRS patient identifier type for central FHIR Patient.id (source patient routing)
intelehealth.fhir.patient.source.identifier.type.uuid=b2f192c2-346a-486c-bcb4-7a35616890ba
intelehealth.fhir.patient.source.identifier.type.name=Source Patient Id

# Structured observation routing (concept-only; comma-separated OpenMRS concept_id values)
obs.chief_complaint.concept.ids=163212,5219
obs.medical_history.concept.ids=163210,165668
obs.physical_exam.concept.ids=163213
obs.family_history.concept.ids=163211
obs.diagnosis.concept.ids=163219
obs.referral.concept.ids=165238
obs.follow_up.concept.ids=163345
obs.image.concept.ids=163371,163372

# Layer 1 clinical term coding: OpenMRS concept dictionary SNOMED/LOINC maps before JSON lookups
concept.coding.enabled=true
concept.coding.sources=SNOMED CT,LOINC
